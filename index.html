<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문앞택배</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf5f8; --fg:#2c3550; --muted:#6c7896; --panel:#ffffff; --line:#cfe3ea;
  --kraft:#e3ad72; --go:#3fbf95; --go-d:#2b9673; --pink:#ff8f8f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b2233; --fg:#eef1fa; --muted:#a5afc8; --panel:#262f45; --line:#38435f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2233; --fg:#eef1fa; --muted:#a5afc8; --panel:#262f45; --line:#38435f;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 28px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:2.3rem;margin:0;color:var(--fg)}
header p{margin:0;color:var(--muted);font-size:.95rem}
.hud{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;background:var(--panel);border:2px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:10px 18px;font-size:.95rem}
.hud b{font-family:"Jua",sans-serif;font-weight:400;font-size:1.45rem;margin-left:5px}
.hud .lbl{color:var(--muted)}
.hud .grow{flex:1}
.hud .hname{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;font-size:1.1rem}
.name-row{display:flex;gap:8px;justify-content:center;align-items:center;margin:14px 0}
.name-row input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--fg);text-align:center}
.name-row input:focus-visible{outline:3px solid #ffc94d;outline-offset:2px}
button.dice{font-size:1.2rem;border:2px solid var(--line);background:#eef6f9;border-radius:999px;width:42px;height:42px;flex:0 0 auto;cursor:pointer}
button.dice:active{background:var(--line)}
.result-name{font-family:"Jua",sans-serif;font-size:1.3rem;color:var(--fg);margin:0}
.result-meta{font-size:.78rem;color:var(--muted);margin:2px 0 0}
.bag{display:flex;gap:6px;align-items:center}
.bag i{width:34px;height:28px;border-radius:9px;border:2px dashed var(--line)}
.bag i.on{border:2px solid #c98a4c;background:var(--kraft);background-image:linear-gradient(90deg,transparent 42%,#f6d7a6 42%,#f6d7a6 58%,transparent 58%)}
.bag.full i.on{animation:wob .35s ease-in-out infinite alternate}
@keyframes wob{to{transform:translateY(-2px) rotate(-3deg)}}
.stage{position:relative;border:2px solid var(--line);border-radius:0 0 22px 22px;overflow:hidden;background:#e3f1f6}
canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(214,236,243,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:14px}
.overlay[hidden]{display:none}
.card{background:#fff;color:#2c3550;border-radius:26px;padding:22px 26px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:center;box-shadow:0 6px 0 #c4dde6}
.card h2{font-family:"Jua",sans-serif;font-weight:400;font-size:2.3rem;margin:0 0 4px}
.card p{margin:4px 0;line-height:1.55;font-size:.95rem;color:#56627f}
.rules{text-align:left;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:14px auto;max-width:420px;font-size:.92rem;line-height:1.45;color:#3d4766}
.rules kbd{font-family:inherit;display:inline-block;min-width:30px;text-align:center;background:#eef6f9;color:#2c3550;border-radius:8px;padding:2px 7px;font-weight:700;box-shadow:0 2px 0 #c4dde6}
.score-big{font-family:"Jua",sans-serif;font-size:3.4rem;line-height:1;margin:8px 0 6px;color:#2b9673}
.stats{display:flex;justify-content:center;gap:16px;margin:10px 0 14px;font-size:.92rem;color:#56627f;flex-wrap:wrap}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button.cta,button.sub{font-family:"Jua",sans-serif;font-size:1.2rem;border:0;border-radius:999px;padding:11px 26px;cursor:pointer}
button.cta{background:var(--go);color:#fff;box-shadow:0 4px 0 var(--go-d)}
button.sub{background:#fff1d9;color:#8a5a22;box-shadow:0 4px 0 #ebcf9f}
button.cta:active,button.sub:active{transform:translateY(3px);box-shadow:0 1px 0 var(--go-d)}
button:focus-visible{outline:3px solid #ffc94d;outline-offset:3px}
.pad{display:none;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.pad button{font-size:1.5rem;padding:14px 0;border-radius:18px;border:2px solid var(--line);background:var(--panel);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active{background:var(--line)}
@media (pointer:coarse){.pad{display:grid}}
.foot{color:var(--muted);font-size:.85rem;margin-top:10px}
@media (max-width:480px){
  .card{padding:18px 18px}
  .card h2{font-size:1.8rem}
  .card p{font-size:.88rem}
  .rules{font-size:.85rem;gap:7px 10px}
  .score-big{font-size:2.6rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>문앞택배</h1>
    <p>이웃들이 문 앞에 내놓은 택배, 제비 기사님이 빠르게 챙겨요.</p>
  </header>

  <div class="hud">
    <div><span class="lbl">기사님</span><b id="hName" class="hname">-</b></div>
    <div><span class="lbl">점수</span><b id="hScore">0</b></div>
    <div><span class="lbl">스테이지</span><b id="hStage">1</b><span class="lbl">/3</span></div>
    <div><span class="lbl">남은 시간</span><b id="hTime">30</b><span class="lbl">초</span></div>
    <div class="grow"></div>
    <div class="bag" id="hBag" title="택배 가방 (최대 3개)"><span class="lbl">가방</span><i></i><i></i><i></i></div>
  </div>

  <div class="stage">
    <canvas id="game" width="960" height="440" aria-label="오피스텔 복도 게임 화면"></canvas>
    <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
  </div>

  <div class="pad" aria-label="터치 조작">
    <button data-k="left" aria-label="왼쪽">◀</button>
    <button data-k="up" aria-label="줍기">▲</button>
    <button data-k="down" aria-label="비우기">▼</button>
    <button data-k="right" aria-label="오른쪽">▶</button>
  </div>
  <p class="foot">◀ ▶ 이동 · ▲ 택배 줍기 (최대 3개) · ▼ 왼쪽 택배보관함에서 가방 비우기</p>
</div>

<script>
(() => {
  // ===== 설정 =====
  const CTA_URL = '';               // 종료 화면 버튼 링크 (딥링크/이벤트 페이지 연결 예정)
  const W = 960, H = 440;
  const FLOOR = 300, GROUND = 392;
  const DOOR_W = 60, DOOR_H = 162, DOOR_TOP = FLOOR - DOOR_H;
  const LOCKER_RANGE = 150;
  const TOTAL = 30, STAGE_LEN = 10;
  const HANDOFF_BONUS = 50;

  const LV = [
    { spawn: 2.0, warn: 1.1,  open: 1.0,  doors: 4, double: 0,    life: 9 },
    { spawn: 1.3, warn: 0.8,  open: 0.75, doors: 6, double: 0.2,  life: 7 },
    { spawn: 0.8, warn: 0.55, open: 0.6,  doors: 8, double: 0.45, life: 5.5 },
  ];
  const ORDER = [2, 5, 0, 7, 3, 6, 1, 4];

  const NAME_ADJ = ['빠른', '성실한', '친절한', '든든한', '야무진', '씩씩한', '부지런한', '상쾌한', '날쌘', '믿음직한'];
  const NAME_NOUN = ['제비', '배달왕', '택배요정', '해결사', '번개손', '출동요원', '오늘의영웅', '기사님', '수거왕', '칼배달'];
  function randomName() {
    const a = NAME_ADJ[Math.random() * NAME_ADJ.length | 0];
    const n = NAME_NOUN[Math.random() * NAME_NOUN.length | 0];
    return `${a}${n}${Math.floor(Math.random() * 90 + 10)}`;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function stamp() {
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  const DOOR_C = [
    ['#a8dcc8', '#6fb39b'], ['#f7b9a8', '#d98a77'], ['#fbe08f', '#d4b04f'], ['#c9b8ee', '#9c87cf'],
    ['#a9d1f2', '#74a6d1'], ['#f5b8d2', '#d488ab'], ['#b9e3a0', '#88bf6c'], ['#f8cfa0', '#d9a26a'],
  ];
  const MATS = ['#ffd6d6', '#d8f0e6', '#fff0c2', '#e2dcfa', '#d7ebfb', '#fde0ec', '#e3f3d6', '#ffe6cc'];
  const NEIGHBORS = [
    { hair: '#5a3b2a', style: 'bob',   shirt: '#ff9fb2', skin: '#ffe0c8' },
    { hair: '#2e2a33', style: 'short', shirt: '#8fc7ff', skin: '#f7d2b3' },
    { hair: '#c9893f', style: 'bun',   shirt: '#9ee0b8', skin: '#ffe3cf' },
    { hair: '#3a2f52', style: 'cap',   shirt: '#ffcf6b', skin: '#f3c9a6', cap: '#7aa7ff' },
    { hair: '#7a4a2a', style: 'pony',  shirt: '#c6b3ff', skin: '#ffdcc4' },
    { hair: '#24252e', style: 'short', shirt: '#ffb38a', skin: '#efc29e' },
    { hair: '#d8a24a', style: 'bob',   shirt: '#7fd6d0', skin: '#ffe6d3' },
    { hair: '#4a2f24', style: 'bun',   shirt: '#ff8f8f', skin: '#f6cfb0' },
  ];

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit(); addEventListener('resize', fit);

  const doors = [];
  for (let i = 0; i < 8; i++) doors.push({ i, x: 200 + i * 100, num: 701 + i, state: 'closed', t: 0, pkg: null, dur: 1, openDur: 1 });

  const p = { x: 480, dir: 1, walk: 0, moving: false, dip: 0 };
  const keys = { left: false, right: false };
  let state = 'ready', score = 0, elapsed = 0, spawnT = 0, level = 0;
  let bag = 0, handoffs = 0, missed = 0, picked = 0, floats = [], parts = [], shake = 0, banner = null, T = 0;

  let best = 0;
  try { best = parseInt(localStorage.getItem('moonap-best') || '0', 10) || 0; } catch (e) { best = 0; }
  let playerName = '';
  try { playerName = localStorage.getItem('moonap-name') || ''; } catch (e) { playerName = ''; }

  const overlay = document.getElementById('overlay');
  const card = document.getElementById('card');

  function showStart() {
    const suggested = esc(playerName || randomName());
    card.innerHTML = `
      <h2>문앞택배</h2>
      <p>오피스텔 7층, 이웃들이 하나둘 문 앞에 택배를 내놓아요.<br>제비 기사님과 함께 빠르게 챙겨 주세요!</p>
      <div class="name-row">
        <input id="nameInput" maxlength="12" placeholder="닉네임 입력" value="${suggested}" autocomplete="off">
        <button class="dice" id="diceBtn" type="button" title="랜덤 닉네임">🎲</button>
      </div>
      <div class="rules">
        <span><kbd>◀</kbd> <kbd>▶</kbd></span><span>복도를 이동해요</span>
        <span><kbd>▲</kbd></span><span>택배 줍기 · 빨리 주울수록 최대 100점</span>
        <span><kbd>▼</kbd></span><span>가방은 3개까지! 왼쪽 택배보관함에서 비워요</span>
        <span style="color:#2b9673;font-weight:700">꿀팁</span><span>문이 열릴 때 미리 가 있으면 최고가로 직접 전달받아요! (가방에 담아 보관함엔 꼭 반납)</span>
      </div>
      <p>딱 30초! 10초마다 스테이지가 올라가요. 더 많은 집에서, 더 자주!</p>
      <div class="btns"><button class="cta" id="startBtn">출동하기</button></div>
      ${best ? `<p style="margin-top:10px">최고 점수 ${best}점</p>` : ''}`;
    overlay.hidden = false;
    const nameInput = document.getElementById('nameInput');
    const diceBtn = document.getElementById('diceBtn');
    diceBtn.onclick = () => { nameInput.value = randomName(); nameInput.focus(); };
    const b = document.getElementById('startBtn');
    b.onclick = () => {
      let name = nameInput.value.trim().slice(0, 12);
      if (!name) name = randomName();
      playerName = name;
      try { localStorage.setItem('moonap-name', playerName); } catch (e) {}
      document.getElementById('hName').textContent = playerName;
      start();
    };
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); b.click(); } });
    nameInput.focus(); nameInput.select();
  }

  function showEnd() {
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('moonap-best', String(best)); } catch (e) {} }
    card.innerHTML = `
      <h2>오늘 배송 끝!</h2>
      <p class="result-name">${esc(playerName || randomName())} 기사님</p>
      <div class="score-big">${score}점</div>
      <p class="result-meta">${stamp()} 기록</p>
      <p>${isBest ? '새 최고 점수예요!' : `최고 점수 ${best}점`}</p>
      <div class="stats"><span>챙긴 택배 ${picked}개</span><span>직접전달 ${handoffs}번</span><span>놓친 택배 ${missed}개</span></div>
      <div class="btns">
        <button class="cta" id="startBtn">다시 하기</button>
        <button class="sub" id="ctaBtn">문앞택배 알아보기</button>
      </div>`;
    overlay.hidden = false;
    const b = document.getElementById('startBtn'); b.onclick = start; b.focus();
    document.getElementById('ctaBtn').onclick = () => {
      if (CTA_URL) window.open(CTA_URL, '_blank');
      else document.getElementById('ctaBtn').textContent = '링크 연결 예정';
    };
  }

  function start() {
    if (state === 'play') return;
    state = 'play'; score = 0; elapsed = 0; spawnT = 0.6; level = -1;
    bag = 0; handoffs = 0; missed = 0; picked = 0; floats = []; parts = []; shake = 0; banner = null;
    Object.assign(p, { x: 480, dir: 1, dip: 0 });
    doors.forEach(d => { d.state = 'closed'; d.t = 0; d.pkg = null; });
    overlay.hidden = true;
  }
  function end() { state = 'over'; showEnd(); }

  function addFloat(x, y, text, color, size) { floats.push({ x, y, text, color: color || '#5b6b8a', t: 0, size: size || 20 }); }
  function burst(x, y, colors) {
    for (let k = 0; k < 10; k++) {
      const a = Math.random() * Math.PI * 2, s = 90 + Math.random() * 120;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, t: 0, c: colors[k % colors.length], r: 3 + Math.random() * 3 });
    }
  }
  function pkgValue(age) { return Math.max(10, Math.round(100 - age * 10)); }

  function nearDoor() {
    let bd = null, dist = 999;
    for (const d of doors) { const dx = Math.abs(p.x - d.x); if (dx < 36 && dx < dist) { dist = dx; bd = d; } }
    return bd;
  }

  function pickup() {
    const d = nearDoor();
    if (!d) { addFloat(p.x, GROUND - 120, '여긴 택배가 없어요', '#7d89a6', 16); return; }
    if (d.state === 'open') { handoff(d); return; }
    if (!d.pkg) { addFloat(p.x, GROUND - 120, '여긴 택배가 없어요', '#7d89a6', 16); return; }
    if (bag >= 3) { addFloat(p.x, GROUND - 120, '가방이 가득! 보관함에서 비워요', '#e08a2e', 17); return; }
    const v = pkgValue(d.pkg.age);
    score += v; bag++; picked++; d.pkg = null; p.dip = 0.22;
    burst(d.x, FLOOR + 30, ['#ffc94d', '#ff8fa3', '#7fd3b8', '#8fc7ff']);
    addFloat(p.x, GROUND - 120, `+${v}`, v >= 70 ? '#22a27a' : v >= 40 ? '#e0a020' : '#e07a4a', 26);
  }

  function emptyBag() {
    if (p.x > LOCKER_RANGE) { addFloat(p.x, GROUND - 120, '보관함 앞에서 비울 수 있어요', '#7d89a6', 16); return; }
    if (!bag) { addFloat(p.x, GROUND - 120, '가방이 비어 있어요', '#7d89a6', 16); return; }
    bag = 0;
    burst(66, FLOOR - 90, ['#7fd3b8', '#ffffff', '#ffc94d']);
    addFloat(66, FLOOR - 200, '가방 비움! 다시 출동', '#22a27a', 18);
  }

  function handoff(d) {
    if (bag >= 3) { addFloat(p.x, GROUND - 120, '가방이 가득! 보관함에서 비워요', '#e08a2e', 17); return; }
    const v = 100 + HANDOFF_BONUS;
    score += v; bag++; picked++; handoffs++; p.dip = 0.22;
    d.state = 'closed'; d.pkg = null; d.t = 0;
    burst(d.x, FLOOR + 30, ['#ffc94d', '#7fd3b8', '#8fc7ff', '#ffffff']);
    addFloat(p.x, GROUND - 130, `+${v} 직접전달!`, '#2b9673', 26);
    addFloat(d.x, DOOR_TOP - 6, '마침 와 계셨네요, 감사합니다!', '#5b6b8a', 15);
  }

  function spawnOne() {
    const L = LV[level];
    const cand = ORDER.slice(0, L.doors).map(i => doors[i]).filter(d => d.state === 'closed' && !d.pkg);
    if (!cand.length) return;
    const d = cand[Math.random() * cand.length | 0];
    d.state = 'warn'; d.t = L.warn; d.dur = L.warn; d.openDur = L.open;
  }

  function update(dt) {
    elapsed += dt;
    if (elapsed >= TOTAL) { end(); return; }
    const lv = Math.min(LV.length - 1, Math.floor(elapsed / STAGE_LEN));
    if (lv !== level) {
      level = lv;
      banner = { text: `STAGE ${lv + 1}`, sub: lv === 0 ? '문 앞 택배를 챙겨요!' : '더 많은 집에서, 더 자주 나와요', t: 0 };
    }
    const L = LV[level];

    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    p.moving = dir !== 0;
    if (dir) { p.dir = dir; p.x += dir * 330 * dt; p.walk += dt; }
    p.x = Math.max(40, Math.min(W - 30, p.x));
    if (p.dip > 0) p.dip -= dt;

    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = L.spawn * (0.75 + Math.random() * 0.5);
      spawnOne();
      if (Math.random() < L.double) spawnOne();
    }

    for (const d of doors) {
      if (d.state === 'warn') { d.t -= dt; if (d.t <= 0) { d.state = 'open'; d.t = d.openDur; } }
      else if (d.state === 'open') {
        d.t -= dt;
        if (d.t <= 0) { d.state = 'closed'; d.pkg = { age: 0 }; }
      }
      if (d.pkg) {
        d.pkg.age += dt;
        if (d.pkg.age > L.life) { d.pkg = null; missed++; addFloat(d.x, FLOOR + 6, '이웃이 다시 들고 갔어요', '#7d89a6', 14); }
      }
    }
    if (shake > 0) shake -= dt;
  }

  // ===== 그리기 도구 =====
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function font(px) { return `${px}px "Jua", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`; }
  function ell(x, y, rx, ry, fill, stroke, lw) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function softBall(x, y, rx, ry, light, base, edge) {
    const g = ctx.createRadialGradient(x - rx * 0.35, y - ry * 0.45, 1, x, y, Math.max(rx, ry) * 1.05);
    g.addColorStop(0, light); g.addColorStop(0.55, base); g.addColorStop(1, edge);
    ell(x, y, rx, ry, g);
  }
  function archPath(x, top, w, bottom) {
    const r = w / 2;
    ctx.beginPath(); ctx.moveTo(x - r, bottom); ctx.lineTo(x - r, top + r);
    ctx.arc(x, top + r, r, Math.PI, 0); ctx.lineTo(x + r, bottom); ctx.closePath();
  }

  // ===== 배경 =====
  function drawBG() {
    const g = ctx.createLinearGradient(0, 0, 0, FLOOR);
    g.addColorStop(0, '#d6ecf3'); g.addColorStop(1, '#e8f5f8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, FLOOR);
    // 도트 벽지
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let y = 46; y < FLOOR - 80; y += 34) for (let x = (y / 34 % 2) * 26; x < W; x += 52) ell(x, y, 3, 3, 'rgba(255,255,255,.6)');
    // 천장 몰딩 + 둥근 조명
    ctx.fillStyle = '#c3e1ea'; ctx.fillRect(0, 0, W, 22);
    for (let x = 0; x < W; x += 32) { ctx.beginPath(); ctx.arc(x + 16, 22, 16, 0, Math.PI); ctx.fillStyle = '#c3e1ea'; ctx.fill(); }
    for (let x = 163; x < W; x += 204) {
      const rg = ctx.createRadialGradient(x, 52, 4, x, 52, 120);
      rg.addColorStop(0, 'rgba(255,248,214,.75)'); rg.addColorStop(1, 'rgba(255,248,214,0)');
      ctx.fillStyle = rg; ctx.fillRect(x - 120, 20, 240, 170);
      ctx.strokeStyle = '#9cc6d3'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 22); ctx.lineTo(x, 40); ctx.stroke();
      softBall(x, 50, 13, 11, '#fffef4', '#fff2b8', '#f0d987');
    }
    // 하단 벽(웨인스코팅)
    ctx.fillStyle = '#c6e5ee'; ctx.fillRect(0, FLOOR - 72, W, 72);
    ctx.fillStyle = '#addbe7'; ctx.fillRect(0, FLOOR - 76, W, 6);
    ctx.fillStyle = '#9cc6d3'; rr(0, FLOOR - 10, W, 12, 0); ctx.fill();
    // 바닥 (나무 마루)
    const fg = ctx.createLinearGradient(0, FLOOR, 0, H);
    fg.addColorStop(0, '#f4d9b8'); fg.addColorStop(1, '#ecc79c');
    ctx.fillStyle = fg; ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.strokeStyle = 'rgba(190,140,90,.25)'; ctx.lineWidth = 1.5;
    [FLOOR + 24, FLOOR + 56, FLOOR + 96].forEach((y, r) => {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      for (let x = (r % 2) * 70; x < W; x += 140) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + (r === 0 ? -24 : r === 1 ? -32 : -40)); ctx.stroke(); }
    });
    // 문 사이 화분
    for (let i = 0; i < 7; i++) if (i % 2 === 0) drawPlant(200 + i * 100 + 50, FLOOR + 8, i);
  }

  function drawPlant(x, y, i) {
    ell(x, y + 2, 13, 4, 'rgba(120,80,40,.15)');
    ctx.fillStyle = ['#ffb3a7', '#ffd88a', '#b9b3ff', '#9fdcc3'][i % 4];
    rr(x - 11, y - 20, 22, 22, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(x - 8, y - 18, 6, 14, 3); ctx.fill();
    [[-8, -30, -0.5], [0, -38, 0], [8, -30, 0.5]].forEach(([dx, dy, a]) => {
      ctx.save(); ctx.translate(x + dx * 0.5, y - 20); ctx.rotate(a + Math.sin(T * 1.5 + i) * 0.05);
      softBall(0, dy + 20, 7, 12, '#b9f0c6', '#6fcf8a', '#4fae6b'); ctx.restore();
    });
  }

  function drawLocker() {
    const x0 = 18, w = 104, h = 196, top = FLOOR - h + 6;
    const near = p.x <= LOCKER_RANGE && bag > 0 && state === 'play';
    ell(x0 + w / 2, FLOOR + 6, 58, 7, 'rgba(120,80,40,.15)');
    ctx.fillStyle = '#ffffff'; rr(x0, top, w, h, 18); ctx.fill();
    ctx.strokeStyle = '#ffb3a7'; ctx.lineWidth = 3; rr(x0, top, w, h, 18); ctx.stroke();
    ctx.fillStyle = '#ff9e8a'; rr(x0 + 8, top + 8, w - 16, 26, 13); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = font(15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('택배보관함', x0 + w / 2, top + 22);
    const cols = ['#ffe3dc', '#fff1c9', '#dff3ea', '#e6e0fb'];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
      const cx = x0 + 11 + c * 28, cy = top + 44 + r * 36;
      ctx.fillStyle = cols[(r + c) % 4]; rr(cx, cy, 25, 31, 8); ctx.fill();
      ell(cx + 19, cy + 16, 2.2, 2.2, '#d9b9a8');
    }
    if (near) {
      ctx.strokeStyle = `rgba(255,201,77,${0.6 + Math.sin(T * 8) * 0.35})`; ctx.lineWidth = 5;
      rr(x0 - 4, top - 4, w + 8, h + 8, 22); ctx.stroke();
    }
  }

  // ===== 문 =====
  function drawDoor(d) {
    const x = d.x, top = DOOR_TOP, [fill, edge] = DOOR_C[d.i];
    // 매트
    ctx.fillStyle = MATS[d.i];
    rr(x - 40, FLOOR + 4, 80, 16, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
    rr(x - 34, FLOOR + 7, 68, 10, 5); ctx.stroke(); ctx.setLineDash([]);
    // 문틀
    archPath(x, top - 6, DOOR_W + 12, FLOOR); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = '#b8d7e1'; ctx.lineWidth = 2; ctx.stroke();
    // 호수 명패
    ctx.fillStyle = '#fff'; rr(x - 19, top - 34, 38, 20, 10); ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = 2; rr(x - 19, top - 34, 38, 20, 10); ctx.stroke();
    ctx.fillStyle = edge; ctx.font = font(13); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(d.num), x, top - 23);

    if (d.state === 'open') {
      archPath(x, top, DOOR_W, FLOOR);
      const ig = ctx.createLinearGradient(0, top, 0, FLOOR);
      ig.addColorStop(0, '#fff1cc'); ig.addColorStop(1, '#f6c98e');
      ctx.fillStyle = ig; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ell(x, top + 60, 20, 30, 'rgba(255,255,255,.35)');
      // 열린 문짝
      ctx.fillStyle = fill; ctx.strokeStyle = edge; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 30, top + 30); ctx.quadraticCurveTo(x + 36, top - 2, x + 44, top + 8);
      ctx.lineTo(x + 44, FLOOR + 8); ctx.lineTo(x + 30, FLOOR); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      const sh = d.state === 'warn' ? Math.sin(T * 60) * 1.8 : 0;
      ctx.save(); ctx.translate(sh, 0);
      archPath(x, top, DOOR_W, FLOOR);
      const dg = ctx.createLinearGradient(x - 33, 0, x + 33, 0);
      dg.addColorStop(0, fill); dg.addColorStop(1, edge);
      ctx.fillStyle = fill; ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.18)'; archPath(x - 12, top + 8, 18, FLOOR - 12); ctx.fill();
      ctx.strokeStyle = edge; ctx.lineWidth = 2.5; archPath(x, top, DOOR_W, FLOOR); ctx.stroke();
      // 동그란 창
      ell(x, top + 36, 13, 13, '#fffdf3', edge, 2.5);
      ctx.strokeStyle = edge; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 13, top + 36); ctx.lineTo(x + 13, top + 36); ctx.moveTo(x, top + 23); ctx.lineTo(x, top + 49); ctx.stroke();
      // 아래 패널
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; rr(x - 20, top + 104, 40, 44, 10); ctx.stroke();
      // 도어락 + 손잡이
      const lit = d.state === 'warn' && Math.floor(T * 10) % 2 === 0;
      ctx.fillStyle = '#4b5470'; rr(x + 11, top + 66, 12, 24, 5); ctx.fill();
      ell(x + 17, top + 74, 2.5, 2.5, lit ? '#7cf0ff' : '#8b95b3');
      ell(x + 17, top + 83, 2.5, 2.5, lit ? '#7cf0ff' : '#8b95b3');
      softBall(x + 17, top + 99, 6, 6, '#fff6c9', '#ffc94d', '#d9a12a');
      ctx.restore();
      if (d.state === 'warn') {
        ctx.fillStyle = 'rgba(255,233,160,.95)'; rr(x - 30, FLOOR - 3, 60, 4, 2); ctx.fill();
      }
    }
    if (d.state === 'warn') {
      const bob = Math.sin(T * 12) * 3, prog = 1 - d.t / d.dur;
      const by = top - 58 + bob;
      ctx.fillStyle = '#ffc94d'; rr(x - 34, by - 15, 68, 30, 15); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 6, by + 14); ctx.lineTo(x, by + 22); ctx.lineTo(x + 6, by + 14); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = font(15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(prog > 0.5 ? '! 덜컹' : '! 철컥', x, by + 1);
    }
  }

  function drawDanger(d) {
    if (d.state !== 'warn' && d.state !== 'open') return;
    const a = d.state === 'open' ? 0.38 : 0.1 + 0.14 * (1 - d.t / d.dur) + Math.sin(T * 14) * 0.04;
    ell(d.x, GROUND - 2, 48, 12, `rgba(255,201,77,${a})`);
  }

  // ===== 이웃 (동글 사람) =====
  function drawNeighbor(d) {
    if (d.state !== 'open') return;
    const n = NEIGHBORS[d.i], x = d.x, fy = FLOOR + 16;
    const prog = 1 - d.t / d.openDur, boxDown = prog > 0.62;
    const sq = Math.sin(T * 10) * 1.2;
    ell(x, fy + 1, 22, 5, 'rgba(120,80,40,.18)');
    // 다리
    ctx.fillStyle = '#5b6380'; rr(x - 11, fy - 16, 9, 16, 4); ctx.fill(); rr(x + 2, fy - 16, 9, 16, 4); ctx.fill();
    // 몸
    ctx.fillStyle = n.shirt; rr(x - 19, fy - 50 + sq, 38, 38, 16); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(x - 14, fy - 46 + sq, 10, 22, 5); ctx.fill();
    // 머리
    const hy = fy - 72 + sq;
    if (n.style === 'pony') { softBall(x - 22, hy + 2, 8, 12, n.hair, n.hair, n.hair); }
    if (n.style === 'bun') { softBall(x, hy - 24, 10, 9, n.hair, n.hair, n.hair); }
    softBall(x, hy, 23, 22, '#fff4ea', n.skin, n.skin);
    ctx.fillStyle = n.hair;
    if (n.style === 'bob') { ctx.beginPath(); ctx.arc(x, hy - 2, 24, Math.PI * 1.02, Math.PI * 1.98); ctx.lineTo(x + 24, hy + 10); ctx.lineTo(x + 18, hy + 10); ctx.lineTo(x + 16, hy - 6); ctx.lineTo(x - 16, hy - 6); ctx.lineTo(x - 18, hy + 10); ctx.lineTo(x - 24, hy + 10); ctx.closePath(); ctx.fill(); }
    else if (n.style === 'cap') { ctx.fillStyle = n.cap; ctx.beginPath(); ctx.arc(x, hy - 6, 22, Math.PI, 0); ctx.fill(); ell(x + 10, hy - 6, 18, 4, n.cap); }
    else { ctx.beginPath(); ctx.arc(x, hy - 4, 23, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(x + 6, hy - 12, x - 22, hy - 8); ctx.closePath(); ctx.fill(); }
    // 얼굴
    ctx.strokeStyle = '#3b3550'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x - 8, hy + 4, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 8, hy + 4, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ell(x - 13, hy + 10, 4.5, 2.8, 'rgba(255,130,150,.45)'); ell(x + 13, hy + 10, 4.5, 2.8, 'rgba(255,130,150,.45)');
    ctx.beginPath(); ctx.arc(x, hy + 10, 3.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    // 택배
    drawBox(x, boxDown ? fy - 10 : fy - 36 + sq, 32, 22);
    ctx.fillStyle = n.skin; ell(x - 16, boxDown ? fy - 14 : fy - 36, 5, 5, n.skin); ell(x + 16, boxDown ? fy - 14 : fy - 36, 5, 5, n.skin);
  }

  function drawBox(cx, cy, w, h) {
    ctx.fillStyle = '#e3ad72'; rr(cx - w / 2, cy - h / 2, w, h, 5); ctx.fill();
    ctx.fillStyle = '#c98a4c'; rr(cx - w / 2, cy + h / 2 - 4, w, 4, 2); ctx.fill();
    ctx.fillStyle = '#f6d7a6'; ctx.fillRect(cx - w * 0.08, cy - h / 2, w * 0.16, h - 2);
    ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(cx - w / 2 + 3, cy - h / 2 + 3, w * 0.25, 4, 2); ctx.fill();
  }

  function drawPackage(d) {
    if (!d.pkg) return;
    const age = d.pkg.age;
    const s = age < 0.25 ? 0.5 + age * 2 + Math.sin(age * 25) * 0.08 : 1;
    const cx = d.x, cy = FLOOR + 34;
    ell(cx, cy + 13, 19, 4, 'rgba(120,80,40,.2)');
    ctx.save(); ctx.translate(cx, cy + 12); ctx.scale(s, s); ctx.translate(0, -12);
    drawBox(0, 0, 34, 26);
    // 하트 스티커
    ctx.fillStyle = '#ff8fa3'; ctx.beginPath();
    ctx.moveTo(9, 2); ctx.bezierCurveTo(9, -2, 15, -2, 15, 2); ctx.bezierCurveTo(15, 5, 12, 7, 9, 9);
    ctx.bezierCurveTo(6, 7, 3, 5, 3, 2); ctx.bezierCurveTo(3, -2, 9, -2, 9, 2); ctx.fill();
    ctx.restore();
    const v = pkgValue(age), left = Math.max(0, 1 - age / (LV[level] || LV[0]).life);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; rr(cx - 22, cy - 28, 44, 8, 4); ctx.fill();
    ctx.fillStyle = v >= 70 ? '#3fbf95' : v >= 40 ? '#ffc94d' : '#ff8f6b';
    rr(cx - 20, cy - 26, Math.max(4, 40 * left), 4, 2); ctx.fill();
  }

  // ===== 제비 기사님 =====
  function drawSwallow() {
    const moving = p.moving;
    const hop = moving ? -Math.abs(Math.sin(p.walk * 11)) * 9 : Math.sin(T * 3) * 1.2;
    const dip = p.dip > 0 ? Math.sin((p.dip / 0.22) * Math.PI) * 8 : 0;
    const x = p.x, gy = GROUND;
    const sc = 1 - hop * -0.004;
    ell(x, gy + 2, 26 + hop * 0.6, 6, 'rgba(120,80,40,.2)');
    ctx.save();
    ctx.translate(x, gy + hop + dip); ctx.scale(p.dir * sc, 1 / sc);

    // 꼬리 (제비 꼬리)
    ctx.fillStyle = '#2b3a73';
    ctx.beginPath(); ctx.moveTo(-18, -26); ctx.lineTo(-50, -14); ctx.lineTo(-36, -26); ctx.lineTo(-52, -36); ctx.lineTo(-18, -38); ctx.closePath(); ctx.fill();
    // 등 택배 (가방)
    if (bag > 0) {
      ctx.fillStyle = '#7fd3b8'; rr(-34, -54, 20, 28, 7); ctx.fill();
      for (let k = 0; k < bag; k++) drawBox(-26, -62 - k * 14, 24, 14);
    }
    // 발
    ctx.strokeStyle = '#f2a03d'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    const fs = moving ? Math.sin(p.walk * 22) * 3 : 0;
    ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(-7 + fs, 0); ctx.moveTo(7, -8); ctx.lineTo(8 - fs, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12 + fs, 0); ctx.lineTo(-1 + fs, 0); ctx.moveTo(3 - fs, 0); ctx.lineTo(14 - fs, 0); ctx.stroke();
    // 몸
    softBall(0, -38, 29, 31, '#5d77c4', '#34488f', '#24336a');
    // 배
    softBall(7, -28, 19, 20, '#ffffff', '#f6f8fc', '#dfe6f3');
    // 목 빨간 부분
    softBall(16, -46, 9, 7, '#ff9a8f', '#f0645b', '#d24b44');
    // 볼터치
    ell(6, -50, 5, 3, 'rgba(255,140,160,.55)');
    // 부리
    ctx.fillStyle = '#ffbf3f'; ctx.beginPath(); ctx.moveTo(25, -54); ctx.quadraticCurveTo(38, -51, 25, -46); ctx.closePath(); ctx.fill();
    // 눈
    ell(14, -59, 8, 8.5, '#ffffff');
    ell(16, -58, 5.5, 6, '#1d1d2b');
    ell(18, -60.5, 2, 2, '#ffffff'); ell(14.5, -55.5, 1, 1, '#ffffff');
    // 날개
    const flap = moving ? Math.sin(p.walk * 24) * 0.45 : Math.sin(T * 2) * 0.05;
    ctx.save(); ctx.translate(-6, -40); ctx.rotate(-0.35 + flap);
    softBall(0, 6, 12, 19, '#4c64b0', '#2b3a73', '#1f2a55'); ctx.restore();
    // 모자
    ctx.fillStyle = '#7fd3b8'; ctx.beginPath(); ctx.arc(2, -64, 19, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(-4, -72, 6, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#5fbf9f'; rr(4, -67, 26, 6, 3); ctx.fill();
    ell(2, -73, 6, 6, '#ffffff'); drawBoxMini(2, -73);
    ctx.restore();

    // 힌트
    if (state === 'play') {
      const d = nearDoor(); let hint = null;
      if (d && d.state === 'open') hint = bag >= 3 ? ['가방 가득!', '#e08a2e'] : ['▲ 직접전달!', '#2b9673'];
      else if (d && d.pkg) hint = bag >= 3 ? ['가방 가득!', '#e08a2e'] : ['▲ 줍기', '#22a27a'];
      else if (p.x <= LOCKER_RANGE && bag) hint = ['▼ 비우기', '#2f7fd6'];
      if (hint) {
        const by = gy - 108 - (bag ? 26 + bag * 6 : 0);
        ctx.font = font(15); const tw = ctx.measureText(hint[0]).width + 20;
        ctx.fillStyle = 'rgba(255,255,255,.95)'; rr(x - tw / 2, by - 13, tw, 26, 13); ctx.fill();
        ctx.strokeStyle = hint[1]; ctx.lineWidth = 2; rr(x - tw / 2, by - 13, tw, 26, 13); ctx.stroke();
        ctx.fillStyle = hint[1]; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(hint[0], x, by + 1);
      }
    }
  }
  function drawBoxMini(cx, cy) {
    ctx.fillStyle = '#e3ad72'; rr(cx - 3.5, cy - 3, 7, 6, 1.5); ctx.fill();
    ctx.fillStyle = '#f6d7a6'; ctx.fillRect(cx - 0.6, cy - 3, 1.2, 6);
  }

  function drawFx(dt) {
    parts = parts.filter(q => (q.t += dt) < 0.7);
    for (const q of parts) {
      q.vy += 420 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      ctx.globalAlpha = 1 - q.t / 0.7; ell(q.x, q.y, q.r, q.r, q.c);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    floats = floats.filter(f => (f.t += dt) < 1.1);
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / 1.1);
      const pop = f.t < 0.12 ? 0.7 + f.t * 2.5 : 1;
      ctx.font = font(Math.round(f.size * pop));
      ctx.lineWidth = 5; ctx.strokeStyle = '#ffffff'; ctx.lineJoin = 'round';
      ctx.strokeText(f.text, f.x, f.y - f.t * 36);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - f.t * 36);
    }
    ctx.globalAlpha = 1;
  }

  function drawBanner(dt) {
    if (!banner || state !== 'play') return;
    banner.t += dt;
    if (banner.t > 1.1) { banner = null; return; }
    const a = banner.t < 0.2 ? banner.t / 0.2 : banner.t > 0.8 ? 1 - (banner.t - 0.8) / 0.3 : 1;
    const s = banner.t < 0.2 ? 0.85 + banner.t * 0.75 : 1;
    ctx.globalAlpha = a;
    ctx.save(); ctx.translate(W / 2, 140); ctx.scale(s, s);
    ctx.fillStyle = '#ffffff'; rr(-170, -46, 340, 92, 46); ctx.fill();
    ctx.strokeStyle = '#ffc94d'; ctx.lineWidth = 4; rr(-170, -46, 340, 92, 46); ctx.stroke();
    ctx.fillStyle = '#ff8f6b'; ctx.font = font(38); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(banner.text, 0, -10);
    ctx.fillStyle = '#5b6b8a'; ctx.font = font(16); ctx.fillText(banner.sub, 0, 22);
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function draw(dt) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 5);
    drawBG();
    drawLocker();
    doors.forEach(drawDoor);
    doors.forEach(drawNeighbor);
    doors.forEach(drawDanger);
    doors.forEach(drawPackage);
    drawSwallow();
    drawFx(dt);
    drawBanner(dt);
    ctx.restore();
  }

  // ===== HUD =====
  const hScore = document.getElementById('hScore'), hStage = document.getElementById('hStage');
  const hTime = document.getElementById('hTime'), hBag = document.getElementById('hBag');
  const slots = hBag.querySelectorAll('i');
  let lastHud = '';
  function hud() {
    const tl = state === 'play' ? Math.ceil(TOTAL - elapsed) : (state === 'over' ? 0 : TOTAL);
    const key = `${score}|${level}|${tl}|${bag}`;
    if (key === lastHud) return; lastHud = key;
    hScore.textContent = score; hStage.textContent = Math.max(1, level + 1); hTime.textContent = tl;
    slots.forEach((s, i) => { s.className = i < bag ? 'on' : ''; });
    hBag.classList.toggle('full', bag >= 3);
  }

  // ===== 입력 =====
  addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
    if (k === 'ArrowLeft') keys.left = true;
    if (k === 'ArrowRight') keys.right = true;
    if (e.repeat) return;
    if (state === 'play') { if (k === 'ArrowUp') pickup(); if (k === 'ArrowDown') emptyBag(); }
  });
  addEventListener('keyup', e => { if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false; });
  addEventListener('blur', () => { keys.left = keys.right = false; });
  document.querySelectorAll('.pad button').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (k === 'left' || k === 'right') keys[k] = true;
      else if (state === 'play') (k === 'up' ? pickup : emptyBag)();
    });
    const up = () => { if (k === 'left' || k === 'right') keys[k] = false; };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, up));
  });

  // ===== 루프 =====
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; T += dt;
    if (state === 'play') update(dt);
    draw(dt); hud();
    requestAnimationFrame(loop);
  }
  showStart();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(loop));
})();
</script>
</body>
</html>
